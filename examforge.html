  document.getElementById("seed-btn2")?.addEventListener("click", seedSampleData);
}
function buildTestFromSelected() {
  const u = currentUser();
  const picked = state.bank.filter(q => bankSelected.has(q.id));
  if (picked.length === 0) return;
  const subj = picked[0].subject || "General";
  const allSame = picked.every(q => q.subject === subj);
  const now = Date.now();
  const t = {
    id: uid("t"), ownerId: u.id,
    title: `Custom Test · ${new Date().toLocaleDateString()}`,
    subject: allSame ? subj : "General",
    durationSec: Math.max(60, picked.length * 90),
    instructions: "Built from your Question Bank.",
    questions: picked.map(q => ({ ...q, id: uid("q") })),
    createdAt: now, updatedAt: now,
  };
  state.tests.push(t); persistTests();
  bankSelected.clear();
  toast(`Test created from ${picked.length} bank questions`);
  go("tests");
}

let exam = null;
function renderExam(testId) {
  const t = state.tests.find(x=>x.id===testId);
  if (!t) { go("tests"); return; }
  if (!exam || exam.testId !== testId) {
    liveCoachState = { hintsShown: new Set(), lastHintAt: 0 };
    exam = {
      testId, startedAt: Date.now(), lastEnterTs: Date.now(), currentIdx: 0,
      drafts: Object.fromEntries(t.questions.map(q=>[q.id,{value:null,marked:false,timeSpentSec:0}])),
      submitOpen: false,
    };
  }
  paintExam();
  if (!exam.timer) {
    exam.timer = setInterval(()=>paintExam(), 1000);
    exam.keyHandler = handleExamKey;
    window.addEventListener("keydown", exam.keyHandler);
    exam.beforeUnload = (e)=>{ e.preventDefault(); e.returnValue=""; };
    window.addEventListener("beforeunload", exam.beforeUnload);
  }
}
function paintExam() {
  const app = document.getElementById("app");
  const t = state.tests.find(x=>x.id===exam.testId);
  if (!t) { teardownExam(); return; }
  const elapsed = Math.floor((Date.now()-exam.startedAt)/1000);
  const remaining = Math.max(0, t.durationSec - elapsed);
  if (remaining <= 0 && !exam.submitting) { submitExam(true); return; }
  const currentQ = t.questions[exam.currentIdx];
  const counts = computeExamCounts(t);
  const secOnQ = Math.floor((Date.now()-exam.lastEnterTs)/1000) + (exam.drafts[currentQ.id].timeSpentSec||0);
  try { maybeShowLiveCoachHint(t, currentQ, secOnQ, remaining); } catch(e) {}

  app.innerHTML = `
    <div class="exam">
      <div class="exam-top">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="mark"></div>
          <div class="exam-title">${escapeHtml(t.title)}<small>${t.subject} · ${t.questions.length} questions</small></div>
        </div>
        <div class="exam-timer ${remaining<60?"warn":""}">${fmtDuration(remaining)}</div>
        <button class="btn btn-primary" id="exam-submit">Submit exam</button>
      </div>
      <div class="exam-body">
        <section class="exam-question">
          <div class="exam-q-wrap">
            <div class="exam-q-meta">
              <span class="mono">Q ${exam.currentIdx+1} / ${t.questions.length}</span>
              <span class="badge">${currentQ.type}</span>
              <span>+${currentQ.marks} / −${currentQ.negativeMarks}</span>
              ${currentQ.topic?`<span>· ${escapeHtml(currentQ.topic)}</span>`:""}
              ${currentQ.difficulty?`<span class="pill ${currentQ.difficulty==='easy'?'diff-easy':currentQ.difficulty==='hard'?'diff-hard':'diff-medium'}" style="font-size:10px;padding:1px 6px">${currentQ.difficulty}</span>`:""}
            </div>
            <div class="exam-q-stem">${escapeHtml(currentQ.stem)}</div>
            <div class="exam-options" id="exam-input-area">${renderExamInput(currentQ, exam.drafts[currentQ.id].value)}</div>
            <div class="exam-controls">
              <button class="btn btn-secondary" id="exam-prev" ${exam.currentIdx===0?"disabled":""}>← Previous</button>
              <button class="btn btn-secondary" id="exam-clear" style="color:var(--muted)">Clear response</button>
              <button class="btn ${exam.drafts[currentQ.id].marked?"":"btn-secondary"}" id="exam-mark" style="${exam.drafts[currentQ.id].marked?'background:color-mix(in srgb,var(--amber) 15%,transparent);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);color:var(--amber)':''}">${exam.drafts[currentQ.id].marked?"★ Marked":"☆ Mark for review"}</button>
              <div style="flex:1"></div>
              <button class="btn btn-primary" id="exam-next" ${exam.currentIdx>=t.questions.length-1?"disabled":""}>Save & Next →</button>
            </div>
            <p class="exam-shortcuts">Shortcuts: 1–${currentQ.type==="integer"?"—":"9"} select · N next · P prev · M mark · C clear</p>
          </div>
        </section>
        <aside class="exam-palette">
          <div class="legend">
            <div class="legend-row"><span><span class="dot" style="background:color-mix(in srgb,var(--green) 60%,transparent)"></span>Answered</span><span class="mono" style="color:var(--dim)">${counts.answered}</span></div>
            <div class="legend-row"><span><span class="dot" style="background:color-mix(in srgb,var(--amber) 60%,transparent)"></span>Marked</span><span class="mono" style="color:var(--dim)">${counts.marked}</span></div>
            <div class="legend-row"><span><span class="dot" style="background:color-mix(in srgb,var(--violet) 60%,transparent)"></span>Ans+Marked</span><span class="mono" style="color:var(--dim)">${counts.both}</span></div>
            <div class="legend-row"><span><span class="dot" style="background:var(--border-strong)"></span>Not visited</span><span class="mono" style="color:var(--dim)">${counts.notVisited}</span></div>
          </div>
          <div class="palette-grid">
            ${t.questions.map((q,i)=>{
              const d = exam.drafts[q.id];
              const hasVal = d.value !== null && !(Array.isArray(d.value) && d.value.length===0);
              const cls = i===exam.currentIdx ? "current"
                : (hasVal && d.marked) ? "answered-marked"
                : d.marked ? "marked"
                : hasVal ? "answered" : "";
              return `<button class="palette-btn ${cls}" data-jump="${i}">${i+1}</button>`;
            }).join("")}
          </div>
        </aside>
      </div>
      ${exam.submitOpen ? renderSubmitModal(counts) : ""}
    </div>`;
  bindExam(t);
}
function renderExamInput(q, value) {
  if (q.type === "mcq") {
    return q.options.map((o,i)=>`
      <button class="exam-option mcq${value===i?" selected":""}" data-pick="${i}">
        <span class="ind"></span>
        <span class="opt-text"><span class="opt-letter">${String.fromCharCode(65+i)}.</span>${escapeHtml(o)}</span>
      </button>`).join("");
  }
  if (q.type === "multi") {
    const cur = Array.isArray(value)?value:[];
    return q.options.map((o,i)=>`
      <button class="exam-option multi${cur.includes(i)?" selected":""}" data-pick-multi="${i}">
        <span class="ind"></span>
        <span class="opt-text"><span class="opt-letter">${String.fromCharCode(65+i)}.</span>${escapeHtml(o)}</span>
      </button>`).join("");

}
function bindExam(t) {
  document.getElementById("exam-submit")?.addEventListener("click", ()=>{ exam.submitOpen = true; paintExam(); });
  document.getElementById("exam-prev")?.addEventListener("click", ()=>jumpTo(exam.currentIdx-1));

  document.getElementById("exam-clear")?.addEventListener("click", ()=>{

  });
  document.getElementById("exam-mark")?.addEventListener("click", ()=>{
    const q = t.questions[exam.currentIdx];
    exam.drafts[q.id].marked = !exam.drafts[q.id].marked; paintExam();
  });
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click", ()=>jumpTo(parseInt(b.dataset.jump,10))));
  document.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click", ()=>{
    exam.drafts[t.questions[exam.currentIdx].id].value = parseInt(b.dataset.pick,10); paintExam();
  }));
  document.querySelectorAll("[data-pick-multi]").forEach(b=>b.addEventListener("click", ()=>{

    const i = parseInt(b.dataset.pickMulti,10);
    const cur = Array.isArray(exam.drafts[q.id].value)?exam.drafts[q.id].value:[];
    const set = new Set(cur); set.has(i)?set.delete(i):set.add(i);
    exam.drafts[q.id].value = Array.from(set).sort((a,b)=>a-b); paintExam();
  }));
  document.getElementById("int-answer")?.addEventListener("input", e=>{
    exam.drafts[t.questions[exam.currentIdx].id].value = e.target.value === "" ? null : parseFloat(e.target.value);
  });
  document.getElementById("modal-cancel")?.addEventListener("click", ()=>{ exam.submitOpen = false; paintExam(); });
  document.getElementById("modal-submit")?.addEventListener("click", ()=>submitExam(false));
}
function jumpTo(idx) {
  const t = state.tests.find(x=>x.id===exam.testId);
  if (!t || idx<0 || idx>=t.questions.length) return;
  const cur = t.questions[exam.currentIdx];
  exam.drafts[cur.id].timeSpentSec += Math.max(0, Math.floor((Date.now()-exam.lastEnterTs)/1000));
  exam.lastEnterTs = Date.now();
  exam.currentIdx = idx; paintExam();
}
function computeExamCounts(t) {
  let answered=0, marked=0, both=0, notVisited=0;
  for (const q of t.questions) {
    const d = exam.drafts[q.id];
    const hasVal = d.value !== null && !(Array.isArray(d.value) && d.value.length===0);
    if (hasVal && d.marked) both++;
    else if (d.marked) marked++;
    else if (hasVal) answered++;
    else notVisited++;
  }
  return { answered, marked, both, notVisited };
}
function renderSubmitModal(counts) {

        </div>

          <button class="btn btn-primary" id="modal-submit">Submit now</button>

}
function isAnsCorrect(q, v) {
  if (v===null||v===undefined) return false;
  if (q.type==="mcq") return typeof v==="number" && v===q.correct;
  if (q.type==="integer") return typeof v==="number" && Math.abs(v-q.correct) <= (q.tolerance||0);
  if (q.type==="multi") {
    if (!Array.isArray(v) || v.length !== q.correct.length) return false;
    const a=[...v].sort(), b=[...q.correct].sort();
    return a.every((x,i)=>x===b[i]);
  }
  return false;
}
function submitExam(auto) {
  if (exam.submitting) return;
  exam.submitting = true;
  const t = state.tests.find(x=>x.id===exam.testId);
  if (!t) { teardownExam(); return; }
  const cur = t.questions[exam.currentIdx];
  exam.drafts[cur.id].timeSpentSec += Math.max(0, Math.floor((Date.now()-exam.lastEnterTs)/1000));

  let c=0, w=0, sk=0, sc=0, sm=0;
  const answers = {};
  for (const q of t.questions) {
    const d = exam.drafts[q.id];
    sm += q.marks;
    const isSkipped = d.value === null || (Array.isArray(d.value) && d.value.length===0);
    const ok = !isSkipped && isAnsCorrect(q, d.value);
    if (isSkipped) sk++;
    else if (ok) { c++; sc += q.marks; }
    else { w++; sc -= q.negativeMarks; }
    answers[q.id] = { questionId:q.id, value:d.value, isCorrect:ok, marked:d.marked, timeSpentSec:Math.round(d.timeSpentSec) };
  }
  const u = currentUser();
  const attempt = {
    id: uid("a"), ownerId: u.id, testId:t.id, testTitle:t.title, subject:t.subject,
    startedAt: exam.startedAt, submittedAt: Date.now(),
    durationUsedSec: Math.min(t.durationSec, Math.floor((Date.now()-exam.startedAt)/1000)),
    totalQuestions: t.questions.length, correctCount:c, wrongCount:w, skippedCount:sk,
    scoreObtained: sc, scoreMax: sm, answers,
  };
  state.attempts.push(attempt); persistAttempts();
  teardownExam();
  if (auto) toast("Time up — auto-submitted");
  // streak protection notification
  const stats = computeStats();
  if (stats.todayCount === (state.settings.dailyGoal||3)) toast("🎯 Daily goal met!");
  go("results", { id: attempt.id });
}
function teardownExam() {
  if (exam?.timer) clearInterval(exam.timer);
  if (exam?.keyHandler) window.removeEventListener("keydown", exam.keyHandler);
  if (exam?.beforeUnload) window.removeEventListener("beforeunload", exam.beforeUnload);
  exam = null;
}
function handleExamKey(e) {
  if (!exam) return;
  const tag = e.target?.tagName;
  if (tag==="INPUT"||tag==="TEXTAREA") return;
  const t = state.tests.find(x=>x.id===exam.testId); if (!t) return;
  const q = t.questions[exam.currentIdx]; if (!q) return;
  if (e.key==="ArrowRight"||e.key.toLowerCase()==="n") { e.preventDefault(); jumpTo(exam.currentIdx+1); }
  else if (e.key==="ArrowLeft"||e.key.toLowerCase()==="p") { e.preventDefault(); jumpTo(exam.currentIdx-1); }
  else if (e.key.toLowerCase()==="m") { e.preventDefault(); exam.drafts[q.id].marked = !exam.drafts[q.id].marked; paintExam(); }
  else if (e.key.toLowerCase()==="c") { e.preventDefault(); exam.drafts[q.id].value = null; paintExam(); }
  else if (q.type==="mcq" && /^[1-9]$/.test(e.key)) {
    const i = parseInt(e.key,10)-1;
    if (i < q.options.length) { e.preventDefault(); exam.drafts[q.id].value = i; paintExam(); }
  } else if (q.type==="multi" && /^[1-9]$/.test(e.key)) {
    const i = parseInt(e.key,10)-1;
    if (i < q.options.length) {
      e.preventDefault();
      const cur = Array.isArray(exam.drafts[q.id].value)?exam.drafts[q.id].value:[];
      const set = new Set(cur); set.has(i)?set.delete(i):set.add(i);
      exam.drafts[q.id].value = Array.from(set).sort((a,b)=>a-b);
      paintExam();
    }
  }
}

function renderAnalytics() {
  const s = computeStats();
  if (s.total === 0) {
    return `
      <div class="page-head"><div><h1>Analytics</h1><p>Premium insight layer — needs ≥1 attempt to come alive.</p></div></div>
      <div class="card" style="padding:0"><div class="empty">

        <div class="empty-actions"><button class="btn btn-primary" data-go="tests">Go to My Tests</button></div>
      </div></div>`;
  }

  const series = [...state.attempts].sort((a,b)=>a.submittedAt-b.submittedAt).map(a => ({
    pct: a.correctCount+a.wrongCount>0 ? a.correctCount/(a.correctCount+a.wrongCount) : 0,
    title: a.testTitle,
  }));
  const W=720, H=200, PAD=28;
  const step = series.length===1 ? 0 : (W-PAD*2)/(series.length-1);
  const pts = series.map((s,i)=>({ x: PAD+i*step, y: H-PAD - s.pct*(H-PAD*2) }));
  const path = pts.map((p,i)=>`${i===0?"M":"L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const area = `${path} L ${pts[pts.length-1].x} ${H-PAD} L ${pts[0].x} ${H-PAD} Z`;

  // mistake distribution
  const mistakeCount = {};
  for (const a of state.attempts) {
    for (const qid in a.answers) {
      const tag = a.answers[qid].mistakeTag;
      if (tag) mistakeCount[tag] = (mistakeCount[tag]||0)+1;
    }
  }
  const totalTagged = Object.values(mistakeCount).reduce((a,b)=>a+b, 0);
  const maxW = Math.max(1, ...s.weekly);

  return `
    <div class="page-head"><div><h1>Analytics</h1><p>${s.total} attempt${s.total===1?'':'s'} analyzed.</p></div></div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><div class="card-title">Accuracy trend</div><span class="card-badge">every attempt</span></div>
      <svg viewBox="0 0 ${W} ${H}" class="trend-svg">

            <div class="subject-bar-wrap"><div class="subject-bar" style="width:${Math.max(4,sub.accuracy*100)}%;background:${sub.accuracy>=0.7?'var(--green)':sub.accuracy>=0.5?'var(--amber)':'var(--red)'}"></div></div>

    <div class="card" style="margin-top:14px">
      <div class="card-head"><div class="card-title">Mistake patterns</div>${totalTagged>0?`<span class="card-badge">${totalTagged} tagged</span>`:''}</div>
      ${totalTagged === 0 ? `<p style="color:var(--dim);font-size:13px">Tag your mistakes on the Results page to see patterns here.</p>`
      : MISTAKE_TAGS.map(m => {
        const c = mistakeCount[m.id]||0;
        const pct = totalTagged>0 ? c/totalTagged : 0;
        return `<div class="subject-row">

        </div>`;
      }).join("")}

    <style>@media(max-width:900px){.ana-lower{grid-template-columns:1fr!important}}</style>`;

/* =====================================================================
   SMART INSIGHTS ENGINE — pure functions over user data

/** Generate a list of insights ranked by priority. Pure: input attempts+tests+bank, output array. */
function computeInsights() {
  const insights = [];
  const now = Date.now();
  const day = 86400000;
  const attempts = state.attempts;
  const tests = state.tests;
  const bank = state.bank;

  /* ---- A. ONBOARDING / INACTIVITY ---- */
  if (attempts.length === 0) {
    insights.push({
      id: "start", priority: 60, kind: "info", iconKey: "spark", iconTone: "sky",
      title: "Take your first test to unlock insights",
      body: "ExamForge gets smarter with every attempt. Load the starter pack or build a test to see your dashboard come alive.",
      actions: [
        { label: "Load starter pack", run: "seed" },
        { label: "Go to My Tests", run: "go:tests" },
      ],
      celebrate: false,
    });
    return insights;
  }

  const sorted = [...attempts].sort((a,b)=>a.submittedAt - b.submittedAt);
  const recent = sorted.slice(-5);
  const lastAttempt = sorted[sorted.length-1];
  const daysSinceLast = Math.floor((now - lastAttempt.submittedAt) / day);

  if (daysSinceLast >= 3) {
    insights.push({
      id: "inactive", priority: 95 - Math.min(20, daysSinceLast),  // higher = more urgent
      kind: "critical", iconKey: "warning", iconTone: "red",
      title: `${daysSinceLast} days since your last test`,
      body: "Discipline compounds; so does losing it. Take one test today — even a 5-question warmup keeps the muscle alive.",
      actions: [{ label: "Start a test", run: "go:exam-hub" }],
    });
  }

  /* ---- B. SUBJECT-LEVEL WEAKNESS ---- */
  const bySubject = aggregateBy(attempts, a => [[a.subject, a]]);
  const subjectStats = Array.from(bySubject, ([subj, list]) => {
    let c=0, w=0; for (const a of list) { c+=a.correctCount; w+=a.wrongCount; }
    return { subject:subj, accuracy: c+w>0 ? c/(c+w) : 0, total:c+w, attempts:list.length };
  }).filter(s => s.total >= 3);

  const weakestSubject = [...subjectStats].sort((a,b)=>a.accuracy-b.accuracy)[0];
  if (weakestSubject && weakestSubject.accuracy < 0.65) {
    insights.push({
      id: "weak-subject:"+weakestSubject.subject,
      priority: 88 - Math.round(weakestSubject.accuracy*40),
      kind: "high", iconKey: "warning", iconTone: "amber",
      title: `${weakestSubject.subject} is your weakest subject`,
      body: `${(weakestSubject.accuracy*100).toFixed(0)}% accuracy across ${weakestSubject.total} questions. This is the highest-leverage subject to fix next.`,
      actions: [
        { label: `Drill ${weakestSubject.subject} now`, run: "adaptiveBySubject:"+weakestSubject.subject },
        { label: "See bank", run: "go:bank" },
      ],
    });
  }

  /* ---- C. TOPIC-LEVEL WEAKNESS (granular) ---- */
  const topicAcc = computeTopicAccuracy();
  const weakTopics = topicAcc.filter(t => t.total >= 3 && t.accuracy < 0.6)
                              .sort((a,b)=>a.accuracy - b.accuracy)
                              .slice(0,3);
  if (weakTopics.length > 0) {
    const top = weakTopics[0];
    insights.push({
      id: "weak-topic:"+top.subject+"-"+top.topic,
      priority: 80, kind: "high", iconKey: "brain", iconTone: "amber",
      title: `Topic on fire: ${top.topic} (${top.subject})`,
      body: `${(top.accuracy*100).toFixed(0)}% across ${top.total} questions. ${weakTopics.length>1?`Also struggling with ${weakTopics.slice(1).map(t=>t.topic).join(", ")}.`:"Drill this one topic and your overall accuracy jumps."}`,
      actions: [
        { label: "Generate practice test", run: "topicDrill:"+top.subject+"|"+top.topic },
      ],
    });
  }

  /* ---- D. MISTAKE PATTERN ---- */
  const mistakeCount = {};
  let totalTagged = 0;
  for (const a of attempts) {
    for (const qid in a.answers) {
      const tag = a.answers[qid].mistakeTag;
      if (tag) { mistakeCount[tag] = (mistakeCount[tag]||0)+1; totalTagged++; }
    }
  }
  if (totalTagged >= 3) {
    const top = Object.entries(mistakeCount).sort((a,b)=>b[1]-a[1])[0];
    const [tag, count] = top;
    const share = count / totalTagged;
    if (share > 0.35) {
      insights.push({
        id: "mistake-pattern:"+tag, priority: 78,
        kind: "high", iconKey: "warning", iconTone: "red",
        title: mistakePatternTitle(tag, share),
        body: mistakePatternAdvice(tag, count, totalTagged),
        actions: [{ label: "Open Analytics", run: "go:analytics" }],
      });
    }
  } else if (attempts.length >= 3 && totalTagged < attempts.length) {
    insights.push({
      id: "tag-mistakes", priority: 40, kind: "info", iconKey: "brain", iconTone: "sky",
      title: "Tag your wrong answers",
      body: "You're not tagging mistakes. Without tags, patterns stay invisible. Open any result, tap a wrong question, pick a reason.",
      actions: [{ label: "View latest result", run: "go:results:"+lastAttempt.id }],
    });
  }

  /* ---- E. DIFFICULTY CALIBRATION (easy questions failing = fundamentals gap) ---- */
  const diffStats = computeDifficultyStats();
  if (diffStats.easy && diffStats.easy.total >= 5 && diffStats.easy.accuracy < 0.75) {
    insights.push({
      id: "easy-gap", priority: 86, kind: "critical", iconKey: "warning", iconTone: "red",
      title: "Fundamentals gap detected",
      body: `Only ${(diffStats.easy.accuracy*100).toFixed(0)}% on easy questions (${diffStats.easy.total} attempted). Hard questions can wait — fix the basics first.`,
      actions: [{ label: "Drill easy questions", run: "adaptiveByDifficulty:easy" }],
    });
  } else if (diffStats.easy && diffStats.easy.accuracy > 0.85 && diffStats.hard && diffStats.hard.total >= 3 && diffStats.hard.accuracy < 0.5) {
    insights.push({
      id: "push-hard", priority: 55, kind: "info", iconKey: "trendUp", iconTone: "violet",
      title: "Time to push into hard questions",
      body: `${(diffStats.easy.accuracy*100).toFixed(0)}% easy · ${(diffStats.hard.accuracy*100).toFixed(0)}% hard. Your fundamentals are solid; the next leg is depth.`,
      actions: [{ label: "Drill hard questions", run: "adaptiveByDifficulty:hard" }],
    });
  }

  /* ---- F. MOMENTUM (trending up / down) ---- */
  if (sorted.length >= 4) {
    const half = Math.floor(sorted.length / 2);
    const olderAcc = sliceAcc(sorted.slice(0, half));
    const recentAcc = sliceAcc(sorted.slice(-half));
    const delta = recentAcc - olderAcc;
    if (Math.abs(delta) > 0.04) {
      if (delta > 0) {
        insights.push({
          id: "trending-up", priority: 45, kind: "celebrate", iconKey: "trendUp", iconTone: "green",
          title: `Trending up ${(delta*100).toFixed(0)}%`,
          body: `Your recent average accuracy is ${(recentAcc*100).toFixed(0)}%, up from ${(olderAcc*100).toFixed(0)}%. Whatever you're doing, keep doing it.`,
          celebrate: true,
        });
      } else {
        insights.push({
          id: "trending-down", priority: 82, kind: "critical", iconKey: "trendDown", iconTone: "red",
          title: `Trending down ${(delta*100).toFixed(0)}%`,
          body: `Recent accuracy is ${(recentAcc*100).toFixed(0)}%, down from ${(olderAcc*100).toFixed(0)}%. Slow down. Maybe fewer tests, deeper review.`,
          actions: [{ label: "Reflect on latest", run: "go:reflection" }],
        });
      }
    }
  }

  /* ---- G. SPACED REPETITION (review old mistakes) ---- */
  const reviewPool = collectReviewPool();
  if (reviewPool.length >= 5) {
    insights.push({
      id: "spaced-review", priority: 72, kind: "high", iconKey: "repeat", iconTone: "violet",
      title: `${reviewPool.length} questions due for review`,
      body: `You got these wrong 2–7 days ago. Now's the optimal moment to retry them — the spacing effect makes it stick.`,
      actions: [{ label: "Build review test", run: "spacedReview" }],
    });
  }

  /* ---- H. TIME ANOMALY (slow / fast vs personal baseline) ---- */
  const speedByS = computeSpeedBySubject();
  const overallSpeed = avgSecPerQ(attempts);
  for (const [subj, sec] of speedByS) {
    if (overallSpeed && sec > overallSpeed * 1.35) {
      insights.push({
        id: "slow:"+subj, priority: 50, kind: "info", iconKey: "clock", iconTone: "amber",
        title: `You're slower on ${subj}`,
        body: `${fmtPerQ(sec)} per question vs ${fmtPerQ(overallSpeed)} average. In a real exam, speed compounds. Drill timed.`,
        actions: [{ label: `Generate timed ${subj} test`, run: "speedDrill:"+subj }],
      });
      break;
    }
  }

  /* ---- I. STREAK MILESTONE ---- */
  const stats = computeStats();
  if (stats.streak >= 7) {
    insights.push({
      id: "streak", priority: 35, kind: "celebrate", iconKey: "trophy", iconTone: "green",
      title: `${stats.streak}-day streak`,
      body: `That's how it's done. Don't break it tonight.`, celebrate: true,
    });
  } else if (stats.streak >= 3) {
    insights.push({
      id: "streak-build", priority: 25, kind: "celebrate", iconKey: "trophy", iconTone: "green",
      title: `${stats.streak}-day streak`,
      body: `${7-stats.streak} more days to hit a week. Easy wins compound.`, celebrate: true,
    });
  }

  /* ---- J. FORECAST ---- */
  const forecast = projectExamScore();
  if (forecast) {
    insights.push({
      id: "forecast", priority: 30, kind: "info", iconKey: "trendUp", iconTone: "sky",
      title: `Projected exam-day accuracy: ${(forecast.estimate*100).toFixed(0)}%`,
      body: `Based on a weighted average of your last ${forecast.basedOn} attempts (recent ones count more). ${forecast.estimate < 0.7 ? "Below the 70% target — your weak topics are the lever." : "Solid trajectory. Keep the consistency."}`,
    });
  }

  /* ---- K. DAILY GOAL NUDGE ---- */
  const goal = state.settings.dailyGoal || 3;
  if (stats.todayCount === 0) {
    insights.push({
      id: "today-zero", priority: 70, kind: "high", iconKey: "spark", iconTone: "amber",
      title: "Zero tests today — start small",
      body: `Goal is ${goal}. Even a single short test counts. Momentum beats motivation.`,
      actions: [{ label: "Start a quick test", run: "go:exam-hub" }],
    });
  } else if (stats.todayCount > 0 && stats.todayCount < goal) {
    insights.push({
      id: "today-progress", priority: 38, kind: "info", iconKey: "spark", iconTone: "sky",
      title: `${goal - stats.todayCount} more to hit today's goal`,
      body: `You've done ${stats.todayCount}/${goal}. Last push.`,
      actions: [{ label: "Next test", run: "go:exam-hub" }],
    });
  } else if (stats.todayCount >= goal) {
    insights.push({
      id: "today-met", priority: 20, kind: "celebrate", iconKey: "trophy", iconTone: "green",
      title: `Daily goal hit: ${stats.todayCount}/${goal} today`,
      body: `Now do something restorative. Walk, eat, sleep early.`,
      celebrate: true,
    });
  }

  /* ---- L. ADAPTIVE PRACTICE OFFER (always available if bank is rich) ---- */
  if (bank.length >= 5 && weakTopics.length === 0 && weakestSubject) {
    insights.push({
      id: "adaptive-offer", priority: 28, kind: "info", iconKey: "spark", iconTone: "violet",
      title: "Build a test tailored to your weaknesses",
      body: "ExamForge can pick questions weighted toward your weakest subjects automatically.",
      actions: [{ label: "Generate adaptive test", run: "adaptiveOverall" }],
    });
  }

  /* Sort by priority desc, dedupe by id */
  const seen = new Set();
  return insights.filter(i => !seen.has(i.id) && seen.add(i.id)).sort((a,b)=>b.priority - a.priority);
}

/* ---- helpers for insight engine ---- */
function aggregateBy(arr, fn) {
  const map = new Map();
  for (const item of arr) for (const [k, v] of fn(item)) {
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(v);
  }
  return map;
}
function sliceAcc(list) {
  let c=0, w=0; for (const a of list) { c+=a.correctCount; w+=a.wrongCount; }
  return c+w > 0 ? c/(c+w) : 0;
}
function avgSecPerQ(list) {
  let t=0, n=0;
  for (const a of list) { t += a.durationUsedSec; n += (a.totalQuestions - a.skippedCount); }
  return n>0 ? t/n : null;
}
function computeTopicAccuracy() {
  const map = new Map();
  for (const a of state.attempts) {
    const test = state.tests.find(t => t.id === a.testId);
    if (!test) continue;
    for (const q of test.questions) {
      const ans = a.answers[q.id]; if (!ans) continue;
      const isSkipped = ans.value === null || (Array.isArray(ans.value) && ans.value.length===0);
      if (isSkipped) continue;
      const topic = (q.topic || "General").trim();
      const key = a.subject + "|" + topic;
      const cur = map.get(key) || { subject: a.subject, topic, c:0, w:0 };
      if (ans.isCorrect) cur.c++; else cur.w++;
      map.set(key, cur);
    }
  }
  return Array.from(map.values()).map(x => ({ ...x, accuracy: x.c+x.w>0 ? x.c/(x.c+x.w) : 0, total: x.c+x.w }));
}
function computeDifficultyStats() {
  const map = { easy:{c:0,w:0}, medium:{c:0,w:0}, hard:{c:0,w:0} };
  for (const a of state.attempts) {
    const test = state.tests.find(t => t.id === a.testId);
    if (!test) continue;
    for (const q of test.questions) {
      const ans = a.answers[q.id]; if (!ans) continue;
      const isSkipped = ans.value === null || (Array.isArray(ans.value) && ans.value.length===0);
      if (isSkipped) continue;
      const d = q.difficulty || "medium";
      if (!map[d]) continue;
      if (ans.isCorrect) map[d].c++; else map[d].w++;
    }
  }
  const out = {};
  for (const d of ["easy","medium","hard"]) {
    const total = map[d].c + map[d].w;
    out[d] = { total, accuracy: total > 0 ? map[d].c/total : null };
  }
  return out;
}
function computeSpeedBySubject() {
  const map = new Map();
  for (const a of state.attempts) {
    const cur = map.get(a.subject) || { time:0, n:0 };
    cur.time += a.durationUsedSec;
    cur.n += (a.totalQuestions - a.skippedCount);
    map.set(a.subject, cur);
  }
  return Array.from(map, ([s, {time,n}]) => [s, n>0 ? time/n : 0]).filter(([,v])=>v>0);
}
function collectReviewPool() {
  const day = 86400000;
  const now = Date.now();
  const pool = [];
  const seen = new Set();
  for (const a of state.attempts) {
    const age = now - a.submittedAt;
    if (age < 2*day || age > 8*day) continue;
    const test = state.tests.find(t => t.id === a.testId);
    if (!test) continue;
    for (const q of test.questions) {
      const ans = a.answers[q.id];
      if (ans && !ans.isCorrect && ans.value !== null && !(Array.isArray(ans.value) && ans.value.length===0)) {
        if (!seen.has(q.id)) { seen.add(q.id); pool.push(q); }
      }
    }
  }
  return pool;
}
function projectExamScore() {
  const arr = [...state.attempts].sort((a,b)=>a.submittedAt-b.submittedAt);
  if (arr.length < 2) return null;
  const last = arr.slice(-Math.min(10, arr.length));
  let totalW = 0, weighted = 0;
  last.forEach((a, i) => {
    const w = i + 1; // newer = heavier
    const acc = a.correctCount + a.wrongCount > 0 ? a.correctCount/(a.correctCount+a.wrongCount) : 0;
    weighted += acc * w; totalW += w;
  });
  return { estimate: weighted/totalW, basedOn: last.length };
}
function mistakePatternTitle(tag, share) {
  const pct = Math.round(share*100);
  const map = {
    silly:        `${pct}% of mistakes are silly errors`,
    conceptual:   `${pct}% of mistakes are conceptual gaps`,
    "time-pressure": `${pct}% of mistakes are time-pressure errors`,
    calculation:  `${pct}% of mistakes are calculation errors`,
    confusion:    `${pct}% of mistakes are from confusion`,
    guess:        `${pct}% of wrong answers are guesses`,
  };
  return map[tag] || `Dominant mistake type: ${tag} (${pct}%)`;
}
function mistakePatternAdvice(tag, count, total) {
  const map = {
    silly:        "Slow down by 10%. Re-read the stem before each click. Most silly errors die instantly with that one habit.",
    conceptual:   "You need theory time, not more tests. Go back to the textbook for the topics you're missing.",
    "time-pressure": "You're rushing. Try untimed practice to lock in the *right* answer process — then add the clock back gradually.",
    calculation:  "Set up a numerical-precision drill: 20 quick arithmetic problems daily, no calculator. Speeds up your weakest hand.",
    confusion:    "Confusion = vocabulary gap. Make a glossary of terms in your weak topics. Review for 5 minutes before each session.",
    guess:        "Guessing is fine when negative marking allows. But too many guesses = you're not eliminating options. Drill elimination skills.",
  };
  return map[tag] || `Acted on ${count} of ${total} tagged mistakes. Look at Analytics for the full pattern.`;
}

/* ---- INSIGHT ACTION HANDLERS ---- */
function runInsightAction(action) {
  if (action === "seed") return seedSampleData();
  if (action.startsWith("go:results:")) return go("results", { id: action.slice("go:results:".length) });
  if (action.startsWith("go:")) return go(action.slice(3));
  if (action === "spacedReview") return generateSpacedReview();
  if (action === "adaptiveOverall") return generateAdaptiveTest();
  if (action.startsWith("adaptiveBySubject:")) return generateAdaptiveTest({ subject: action.slice("adaptiveBySubject:".length) });
  if (action.startsWith("adaptiveByDifficulty:")) return generateAdaptiveTest({ difficulty: action.slice("adaptiveByDifficulty:".length) });
  if (action.startsWith("topicDrill:")) {
    const [subj, topic] = action.slice("topicDrill:".length).split("|");
    return generateAdaptiveTest({ subject: subj, topic });
  }
  if (action.startsWith("speedDrill:")) {
    return generateAdaptiveTest({ subject: action.slice("speedDrill:".length), tight: true });
  }
}

/* ---- TEST GENERATORS DRIVEN BY INSIGHTS ---- */
function generateSpacedReview() {
  const pool = collectReviewPool();
  if (pool.length === 0) { toast("No review questions in window"); return; }
  const picked = pool.slice(0, Math.min(15, pool.length));
  const u = currentUser();
  const now = Date.now();
  const t = {
    id: uid("t"), ownerId: u.id,
    title: `Spaced Review · ${new Date().toLocaleDateString()}`,
    subject: "General",
    durationSec: Math.max(60, picked.length * 75),
    instructions: "Auto-generated from mistakes 2–7 days old. Spacing effect at work.",
    questions: picked.map(q => ({ ...q, id: uid("q") })),
    createdAt: now, updatedAt: now,
  };
  state.tests.push(t); persistTests();
  toast(`Review test created · ${picked.length} questions`);
  go("exam", { testId: t.id });
}
function generateAdaptiveTest(opts = {}) {
  if (state.bank.length === 0) { toast("Question Bank is empty"); go("bank"); return; }
  let pool = state.bank.slice();
  if (opts.subject) pool = pool.filter(q => q.subject === opts.subject);
  if (opts.topic) pool = pool.filter(q => (q.topic||"").toLowerCase() === opts.topic.toLowerCase());
  if (opts.difficulty) pool = pool.filter(q => (q.difficulty||"medium") === opts.difficulty);
  if (pool.length === 0) { toast("No matching questions in bank"); return; }

  // weighting: prefer questions from topics you've struggled with
  const topicAcc = computeTopicAccuracy();
  const weight = q => {
    const key = (q.subject||"") + "|" + (q.topic||"General");
    const stat = topicAcc.find(t => (t.subject + "|" + t.topic) === key);
    if (!stat || stat.total < 2) return 1.0;        // unknown topics: neutral
    return 1.5 - stat.accuracy;                      // 0.5..1.5 range
  };

  // weighted sample without replacement
  const want = Math.min(opts.count || 10, pool.length);
  const picked = [];
  const items = pool.map(q => ({ q, w: weight(q) }));
  for (let i=0; i<want; i++) {
    const total = items.reduce((s,x)=>s+x.w, 0);
    let r = Math.random()*total;
    for (let j=0; j<items.length; j++) {
      r -= items[j].w;
      if (r <= 0) { picked.push(items[j].q); items.splice(j,1); break; }
    }
  }

  const u = currentUser();
  const now = Date.now();
  const titleBits = [];
  if (opts.subject) titleBits.push(opts.subject);
  if (opts.topic) titleBits.push(opts.topic);
  if (opts.difficulty) titleBits.push(opts.difficulty);
  const title = (titleBits.length ? titleBits.join(" · ") + " — " : "") + "Adaptive Drill";
  const baseSec = opts.tight ? 60 : 90;
  const t = {
    id: uid("t"), ownerId: u.id,
    title: title + " · " + new Date().toLocaleDateString(),
    subject: opts.subject || "General",
    durationSec: Math.max(60, picked.length * baseSec),
    instructions: "AI-generated · weighted toward your weakest topics.",
    questions: picked.map(q => ({ ...q, id: uid("q") })),
    createdAt: now, updatedAt: now,
  };
  state.tests.push(t); persistTests();
  toast(`Adaptive test created · ${picked.length} questions`);
  go("exam", { testId: t.id });
}

function coachReply(qRaw) {
  const q = qRaw.toLowerCase();
  const stats = computeStats();
  const insights = computeInsights();
  const topicAcc = computeTopicAccuracy();
  const diff = computeDifficultyStats();

  // Intent: what should I study / focus / prioritize
  if (/study today|what.*do.*today|focus today|prioritize|next/i.test(q)) {
    if (stats.total === 0) return "You haven't taken a test yet. Load the starter pack and take one — I can't coach without data." + coachActions([{label:"Load starter pack",run:"seed"},{label:"Open My Tests",run:"go:tests"}]);
    const weakTopics = topicAcc.filter(t => t.total >= 3).sort((a,b)=>a.accuracy-b.accuracy).slice(0,2);
    let body = `Today, prioritize:<ul>`;
    if (weakTopics.length) {
      weakTopics.forEach(t => {
        body += `<li><b>${escapeHtml(t.topic)}</b> (${escapeHtml(t.subject)}) — <span class="num">${(t.accuracy*100).toFixed(0)}%</span> across ${t.total} questions.</li>`;
      });
    } else {
      body += `<li>Take a baseline test in your weakest subject so I have more data to work with.</li>`;
    }
    body += `</ul>`;
    const actions = [];
    if (weakTopics[0]) actions.push({label:`Drill ${weakTopics[0].topic}`, run:`topicDrill:${weakTopics[0].subject}|${weakTopics[0].topic}`});
    if (collectReviewPool().length >= 3) actions.push({label:"Run spaced review", run:"spacedReview"});
    actions.push({label:"Open Insights", run:"go:insights"});
    return body + coachActions(actions);
  }

  // Intent: am I ready / readiness
  if (/ready|readiness|score|how am i|how.*doing/i.test(q)) {
    const r = computeReadiness();
    let body = `Your readiness score is <span class="num">${r.score}</span> / 100 — <b>${escapeHtml(r.tier.label)}</b>.<br><br>`;
    const worst = [...r.dimensions].sort((a,b)=>a.score-b.score).slice(0,2);
    body += `Weakest dimensions:<ul>`;
    worst.forEach(d => body += `<li><b>${escapeHtml(d.name)}</b> — <span class="num">${d.score}</span>. ${escapeHtml(d.note)}</li>`);
    body += `</ul>`;
    return body + coachActions([{label:"Open Readiness page", run:"go:readiness"}]);
  }

  // Intent: weakest
  if (/weak|worst|struggl|bad at|low/i.test(q)) {
    if (stats.subjects.length === 0) return "Not enough data yet — take a few tests first.";
    const w = [...stats.subjects].sort((a,b)=>a.accuracy-b.accuracy)[0];
    const wt = topicAcc.filter(t=>t.total>=2).sort((a,b)=>a.accuracy-b.accuracy)[0];
    let body = `Your weakest subject: <b>${escapeHtml(w.subject)}</b> at <span class="num">${(w.accuracy*100).toFixed(0)}%</span> over ${w.total} questions.<br>`;
    if (wt) body += `Specific topic killing you: <b>${escapeHtml(wt.topic)}</b> (<span class="num">${(wt.accuracy*100).toFixed(0)}%</span>).`;
    const actions = [{label:`Drill ${w.subject}`, run:`adaptiveBySubject:${w.subject}`}];
    if (wt) actions.push({label:`Drill ${wt.topic}`, run:`topicDrill:${wt.subject}|${wt.topic}`});
    return body + coachActions(actions);
  }

  // Intent: mistakes / pattern
  if (/mistake|pattern|error|wrong/i.test(q)) {
    const mc = {}; let total = 0;
    for (const a of state.attempts) for (const qid in a.answers) {
      const t = a.answers[qid].mistakeTag;
      if (t) { mc[t]=(mc[t]||0)+1; total++; }
    }
    if (total === 0) return "You haven't tagged any mistakes yet. Open a result page, click any wrong question, pick a reason. Once you do, I can see patterns." + coachActions([{label:"Open History",run:"go:history"}]);
    const top = Object.entries(mc).sort((a,b)=>b[1]-a[1])[0];
    let body = `From <span class="num">${total}</span> tagged mistakes, your dominant pattern is <b>${escapeHtml(top[0])}</b> (${top[1]} times, ${Math.round(top[1]/total*100)}%).<br><br>`;
    body += escapeHtml(mistakePatternAdvice(top[0], top[1], total));
    return body + coachActions([{label:"Full analysis", run:"go:analytics"}]);
  }

  // Intent: speed / time
  if (/slow|fast|speed|time|pace/i.test(q)) {
    const overall = avgSecPerQ(state.attempts);
    if (!overall) return "Not enough attempts to assess your speed yet.";
    const bySubj = computeSpeedBySubject();
    let body = `Your average is <span class="num">${fmtPerQ(overall)}</span> per question.`;
    const slow = bySubj.filter(([,v])=>v>overall*1.2).sort((a,b)=>b[1]-a[1])[0];
    const fast = bySubj.filter(([,v])=>v<overall*0.8).sort((a,b)=>a[1]-b[1])[0];
    if (slow) body += ` Slowest: <b>${escapeHtml(slow[0])}</b> at <span class="num">${fmtPerQ(slow[1])}</span>.`;
    if (fast) body += ` Fastest: <b>${escapeHtml(fast[0])}</b> at <span class="num">${fmtPerQ(fast[1])}</span>.`;
    const actions = [];
    if (slow) actions.push({label:`Speed drill ${slow[0]}`, run:`speedDrill:${slow[0]}`});
    return body + coachActions(actions);
  }

  // Intent: plan
  if (/plan|schedule|strategy|prepare|study guide/i.test(q)) {
    return `I can build you a day-by-day study plan based on your weak topics and exam date.` +
      coachActions([{label:"Open Study Plan", run:"go:plan"}]);
  }

  // Intent: motivation / streak
  if (/streak|motivat|discipline|consistent|consistency/i.test(q)) {
    return `Your streak: <span class="num">${stats.streak}</span> day${stats.streak===1?"":"s"}. ${stats.streak===0?"Start one today. Even a 5-question test counts.":"Don't break it."} Consistency beats intensity.` +
      coachActions([{label:"Start a quick test", run:"go:exam-hub"}]);
  }

  // Intent: flashcards
  if (/flash|card|review|memoriz/i.test(q)) {
    const due = state.flashcards.filter(f => f.due <= Date.now()).length;
    return `You have <span class="num">${state.flashcards.length}</span> flashcards · <span class="num">${due}</span> due now. Review them now to lock in what you've learned.` +
      coachActions([{label:"Review flashcards", run:"go:flashcards"}]);
  }

  // Intent: insight / overview
  if (/insight|overview|tell me|how.*i|summary/i.test(q)) {
    if (insights.length === 0) return "No active insights yet — take a few tests first.";
    let body = `Top 3 insights right now:<ul>`;
    insights.slice(0,3).forEach(i => body += `<li><b>${escapeHtml(i.title)}</b> — ${escapeHtml(i.body.slice(0,90))}…</li>`);
    body += `</ul>`;
    return body + coachActions([{label:"Open Insights", run:"go:insights"}]);
  }

  // Intent: thanks / lol
  if (/thank|thx|cool|nice|awesome|👍/i.test(q)) {
    return "Anytime. Back to work — momentum doesn't pause.";
  }
  if (/^(hi|hey|hello|yo)/i.test(q)) {
    return "Hey. Ready to coach. Try: \"what should I study today?\" or \"am I ready?\"";
  }

  // Fallback: route to insights
  return `I can answer questions about: <b>what to study</b>, <b>readiness</b>, <b>weak areas</b>, <b>mistakes</b>, <b>speed</b>, <b>study plan</b>, <b>flashcards</b>, <b>streak</b>. ` +
    `Or just tap a suggestion below.` +
    coachActions([{label:"Open Insights",run:"go:insights"},{label:"Open Readiness",run:"go:readiness"}]);
}

/* =====================================================================
   EXAM READINESS — composite score across 6 dimensions
   ===================================================================== */
function computeReadiness() {
  const stats = computeStats();
  const target = state.settings.examTarget || 75;

  // 1. Accuracy
  const accScore = stats.accuracy != null ? Math.min(100, (stats.accuracy*100/target)*100) : 0;
  // 2. Consistency: lower variance = higher score
  const lastN = [...state.attempts].sort((a,b)=>b.submittedAt-a.submittedAt).slice(0,8);
  let consScore = 0;
  if (lastN.length >= 3) {
    const accs = lastN.map(a => (a.correctCount+a.wrongCount)>0 ? a.correctCount/(a.correctCount+a.wrongCount) : 0);
    const mean = accs.reduce((s,x)=>s+x,0)/accs.length;
    const variance = accs.reduce((s,x)=>s+(x-mean)*(x-mean),0)/accs.length;
    const std = Math.sqrt(variance);
    // std 0 -> 100, std 0.25 -> 0
    consScore = Math.max(0, Math.min(100, (1 - std/0.25)*100));
  }
  // 3. Speed: closer to 90s/q baseline = better (penalize too fast or too slow)
  let speedScore = 0;
  if (stats.avgSecPerQ != null) {
    const ideal = 90;
    const diff = Math.abs(stats.avgSecPerQ - ideal);
    speedScore = Math.max(0, Math.min(100, (1 - diff/120)*100));
  }
  // 4. Recency: tests in last 7 days
  const day = 86400000;
  const recentCount = state.attempts.filter(a => Date.now()-a.submittedAt <= 7*day).length;
  const recencyScore = Math.min(100, recentCount*15);  // 7+ tests = max
  // 5. Mistake handling: % of wrong answers that have been tagged
  let wrongTotal=0, tagged=0;
  for (const a of state.attempts) {
    for (const qid in a.answers) {
      const av = a.answers[qid];
      if (!av.isCorrect && av.value !== null && !(Array.isArray(av.value) && av.value.length===0)) {
        wrongTotal++;
        if (av.mistakeTag) tagged++;
      }
    }
  }
  const mistakeScore = wrongTotal > 0 ? Math.round(tagged/wrongTotal*100) : 0;
  // 6. Volume: questions attempted
  let totalQs=0;
  for (const a of state.attempts) totalQs += (a.totalQuestions - a.skippedCount);
  const volScore = Math.min(100, totalQs*1.5);  // 67+ questions = max

  const dimensions = [
    { name:"Accuracy",          score:Math.round(accScore),     weight:25, note: stats.accuracy!=null ? `${(stats.accuracy*100).toFixed(0)}% vs ${target}% target` : "No attempts" },
    { name:"Consistency",       score:Math.round(consScore),    weight:15, note: lastN.length>=3 ? `Std dev across last ${lastN.length}: ${((1-consScore/100)*0.25*100).toFixed(0)}%` : "Need 3+ recent attempts" },
    { name:"Speed",             score:Math.round(speedScore),   weight:10, note: stats.avgSecPerQ!=null ? `${fmtPerQ(stats.avgSecPerQ)}/q vs 1:30 ideal` : "—" },
    { name:"Recency",           score:Math.round(recencyScore), weight:15, note: `${recentCount} test${recentCount===1?"":"s"} in last 7 days` },
    { name:"Mistake handling",  score:mistakeScore,             weight:15, note: wrongTotal>0 ? `${tagged}/${wrongTotal} wrong answers analyzed` : "No wrong answers yet" },
    { name:"Volume",            score:Math.round(volScore),     weight:20, note: `${totalQs} questions attempted total` },
  ];
  const total = Math.round(dimensions.reduce((s,d)=>s+d.score*d.weight, 0) / dimensions.reduce((s,d)=>s+d.weight,0));

  const tier = total >= 80 ? { label:"Exam-ready", tone:"green", text:"You're in striking distance. Maintain consistency, sharpen the last weak topics, and don't peak too early." }
             : total >= 60 ? { label:"Building momentum", tone:"amber", text:"Solid foundation. Push depth — drill weak topics, increase volume, and start tagging mistakes." }
             : total >= 30 ? { label:"Early stage", tone:"amber", text:"You've started. The biggest gains come from showing up every day. Take more tests, even short ones." }
             : { label:"Just getting started", tone:"red", text:"Not enough data. Take 3-5 tests this week so I can give you real signal." };

  return { score: total, dimensions, tier };
}

function renderPlanView(plan) {
  const today = startOfDay(Date.now());
  const examDate = new Date(plan.examDate);
  const daysLeft = Math.max(0, Math.ceil((examDate.getTime() - today)/86400000));
  const allTasks = plan.days.flatMap(d => d.tasks);
  const doneCount = allTasks.filter(t => t.done).length;

  return `

      <div>

        <p><b style="color:var(--red-soft)">${daysLeft} day${daysLeft===1?"":"s"}</b> until exam · target <b>${plan.target}%</b> · ${doneCount}/${allTasks.length} tasks done (${pctDone}%)</p>

    </div>

    ${plan.days.map(day => {
      const dts = startOfDay(day.date);
      const isToday = dts === today;
      const isPast = dts < today;
      const dayDone = day.tasks.every(t => t.done);
      const d = new Date(day.date);
      return `<div class="plan-day ${isToday?'today':''} ${isPast?'past':''}">

    }).join("")}
  `;
}
function dayLabel(dts, today) {
  const diff = Math.round((dts - today)/86400000);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  if (diff > 0) return `In ${diff} days`;
  return `${-diff} days ago`;
}
function bindPlanPage() {
  document.getElementById("gen-plan")?.addEventListener("click", () => {
    const examDate = document.getElementById("plan-date").value;
    const target = parseInt(document.getElementById("plan-target").value, 10) || 75;
    const tpd = parseInt(document.getElementById("plan-tpd").value, 10) || 3;
    if (!examDate) { toast("Pick an exam date"); return; }
    state.settings.examDate = examDate;
    state.settings.examTarget = target;

    persistSettings();
    state.plan = buildStudyPlan(examDate, target, tpd);
    persistPlan();
    toast("Study plan generated");
    render();
  });
  document.getElementById("reset-plan")?.addEventListener("click", () => {
    if (!confirm("Reset your study plan?")) return;
    state.plan = null; persistPlan(); render();
  });
  document.querySelectorAll("[data-plan-toggle]").forEach(b => b.addEventListener("click", () => {
    const [date, taskId] = b.dataset.planToggle.split("|");
    const day = state.plan.days.find(d => d.date === date);
    if (!day) return;
    const task = day.tasks.find(t => t.id === taskId);
    if (!task) return;
    task.done = !task.done;
    persistPlan(); render();
  }));
  document.querySelectorAll("[data-plan-act]").forEach(b => b.addEventListener("click", () => runInsightAction(b.dataset.planAct)));
}
function buildStudyPlan(examDate, target, tpd) {
  const today = startOfDay(Date.now());
  const exam = startOfDay(new Date(examDate).getTime());
  const totalDays = Math.max(1, Math.ceil((exam - today)/86400000));
  const stats = computeStats();
  const topicAcc = computeTopicAccuracy();
  const weakTopics = [...topicAcc].filter(t=>t.total>=2).sort((a,b)=>a.accuracy-b.accuracy);
  const weakSubjects = [...stats.subjects].sort((a,b)=>a.accuracy-b.accuracy);
  const SUBJECTS_FALLBACK = ["Physics","Chemistry","Mathematics","Biology"];

  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const dts = today + i*86400000;
    const dateStr = new Date(dts).toISOString().slice(0,10);
    const dayIdx = i;
    const isFinalWeek = (totalDays - i) <= 7;
    const tasks = [];

    // Daily basics
    if (i % 5 === 0 && state.flashcards.length > 0) {
      tasks.push({ id: uid("pt"), label:"Review flashcards", detail:`Spaced repetition cards due today.`, action:"go:flashcards", actionLabel:"Review", done:false });
    }
    // Test of the day -- rotate through weak subjects/topics
    if (isFinalWeek) {
      tasks.push({ id: uid("pt"), label:"Full-length mock test", detail:"Simulate exam conditions. Untimed review after.", action:"go:exam-hub", actionLabel:"Start", done:false });
      if (weakSubjects[0]) {
        tasks.push({ id: uid("pt"), label:`Light drill — ${weakSubjects[0].subject}`, detail:"Quick warm-up; keep momentum.", action:`adaptiveBySubject:${weakSubjects[0].subject}`, actionLabel:"Drill", done:false });
      }
    } else {
      // weak-topic focus
      const topic = weakTopics[dayIdx % Math.max(1,weakTopics.length)];
      if (topic) {
        tasks.push({ id: uid("pt"), label:`Topic drill — ${topic.topic}`, detail:`${topic.subject} · current accuracy ${(topic.accuracy*100).toFixed(0)}%`, action:`topicDrill:${topic.subject}|${topic.topic}`, actionLabel:"Drill", done:false });
      } else {
        const subj = (weakSubjects[dayIdx % Math.max(1,weakSubjects.length)]?.subject) || SUBJECTS_FALLBACK[i%4];
        tasks.push({ id: uid("pt"), label:`Subject drill — ${subj}`, detail:`Build baseline accuracy.`, action:`adaptiveBySubject:${subj}`, actionLabel:"Drill", done:false });
      }
      // also have a second test some days
      if (dayIdx % 2 === 1) {
        tasks.push({ id: uid("pt"), label:"Generate adaptive practice", detail:"Weighted toward your weakest topics.", action:"adaptiveOverall", actionLabel:"Generate", done:false });
      }
    }
    // Reflection every 3 days
    if (i > 0 && i % 3 === 0) {
      tasks.push({ id: uid("pt"), label:"Reflect on the week", detail:"Open Reflection. Write 2 sentences per prompt.", action:"go:reflection", actionLabel:"Reflect", done:false });
    }
    // Spaced review every 4 days
    if (i > 0 && i % 4 === 0) {
      tasks.push({ id: uid("pt"), label:"Spaced repetition review", detail:"Retry mistakes from 2-7 days ago.", action:"spacedReview", actionLabel:"Review", done:false });
    }
    days.push({ date: dateStr, tasks });
  }
  return { generatedAt: Date.now(), examDate, target, tpd, days };
}

function bindFlashcardsPage() {
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  document.getElementById("flash-reveal")?.addEventListener("click", () => { flash.revealed = true; render(); });
  document.querySelectorAll("[data-flash-rate]").forEach(b => b.addEventListener("click", () => {
    rateFlashcard(parseInt(b.dataset.flashRate, 10));
  }));
  document.getElementById("flash-new-session")?.addEventListener("click", () => {
    flash = { sessionIdx: 0, sessionPool: [], revealed: false };
    render();
  });
}
function rateFlashcard(quality) {
  const card = flash.sessionPool[flash.sessionIdx];
  if (!card) return;
  const stored = state.flashcards.find(f => f.id === card.id);
  if (!stored) return;
  // SM-2 algorithm
  stored.lastQuality = quality;
  stored.reps = (stored.reps || 0) + 1;
  if (quality < 3) {
    stored.reps = 0;
    stored.interval = 1;            // 1 day (we use 30s for "again" below)
  } else {
    if (stored.reps === 1) stored.interval = 1;
    else if (stored.reps === 2) stored.interval = 3;
    else stored.interval = Math.round((stored.interval || 1) * stored.ef);
    stored.ef = Math.max(1.3, stored.ef + (0.1 - (5-quality)*(0.08 + (5-quality)*0.02)));
  }
  if (quality === 1) {
    stored.due = Date.now() + 30*1000;       // 30s
  } else if (quality === 2) {
    stored.due = Date.now() + 10*60*1000;    // 10m
  } else {
    stored.due = Date.now() + stored.interval * 86400000;
  }
  persistFlashcards();
  flash.revealed = false;
  flash.sessionIdx++;
  render();
}

/* =====================================================================
   LIVE EXAM COACH — toast hints during exams
   ===================================================================== */
let liveCoachState = { hintsShown: new Set(), lastHintAt: 0 };
function maybeShowLiveCoachHint(t, currentQ, secOnQ, remaining) {
  if (!exam) return;
  if (Date.now() - liveCoachState.lastHintAt < 60000) return;   // min 60s between hints
  const avg = stats_avgQuestionTimeForTest(t);
  let hint = null;
  // 1. Spent too long
  if (secOnQ > Math.max(avg*2, 180) && !liveCoachState.hintsShown.has("slow-"+currentQ.id)) {
    hint = { id:"slow-"+currentQ.id, title:"You've spent a lot of time here", body:"Mark for review and move on — return if time permits." };
  }
  // 2. Time low + lots unanswered
  else if (remaining <= t.durationSec*0.2 && !liveCoachState.hintsShown.has("time-low")) {
    const counts = computeExamCounts(t);
    if (counts.notVisited >= t.questions.length*0.4) {
      hint = { id:"time-low", title:"Time is running short", body:`${counts.notVisited} questions blank. Skim and answer your strongest topics first.` };
    }
  }
  // 3. Halfway and on track / off track
  else if (Math.abs(remaining - t.durationSec*0.5) < 5 && !liveCoachState.hintsShown.has("halftime")) {
    const counts = computeExamCounts(t);
    const expected = Math.round(t.questions.length*0.5);
    if (counts.answered+counts.both < expected*0.7) {
      hint = { id:"halftime", title:"Halfway through", body:`You've answered ${counts.answered+counts.both}/${t.questions.length}. Pace up.` };
    }
  }
  if (hint) {
    liveCoachState.hintsShown.add(hint.id);
    liveCoachState.lastHintAt = Date.now();
    showLiveCoachToast(hint);
  }
}
function stats_avgQuestionTimeForTest(t) {
  // average from past attempts of this test, or per-question avg from all attempts
  const past = state.attempts.filter(a => a.testId === t.id);
  if (past.length === 0) return 90;
  let total=0, n=0;
  for (const a of past) { total += a.durationUsedSec; n += (a.totalQuestions - a.skippedCount); }
  return n > 0 ? total/n : 90;
}
function showLiveCoachToast(hint) {
  const host = document.getElementById("toast-host");

  t.querySelector(".x").addEventListener("click", () => { if (host.contains(t)) host.removeChild(t); });
  host.appendChild(t);
  setTimeout(() => { if (host.contains(t)) host.removeChild(t); }, 6500);
}

let focusTimer = null;

function fmtHHMMSS(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const s = Math.floor(sec);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");
}

function renderFocusActiveFull() {

  const total = (fs.mode==="work"?state.settings.pomodoroMin:fs.mode==="longBreak"?15:state.settings.breakMin)*60;
  const remaining = fs.paused ? fs.remainingAtPause : Math.max(0, Math.round((fs.endTs - Date.now())/1000));

function bindFocusPage() {
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click", ()=>go(b.dataset.go)));

  // Reveal control bar on tap (mobile) or mouse-move (desktop)
  const stage = document.getElementById("focus-stage");
  if (stage) {
    let hideTimer = null;
    const reveal = () => {
      stage.classList.add("show-controls");
      if (hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => stage.classList.remove("show-controls"), 3000);
    };
    stage.addEventListener("mousemove", reveal);
    stage.addEventListener("click", (e) => {
      // Don't toggle when clicking on inputs/buttons
      if (e.target.closest("button, input")) return;
      reveal();
    });

function promptForAim() {
  const current = state.settings.focusAim || "";
  const next = prompt("What's your aim for this focus session?", current);
  if (next === null) return;
  state.settings.focusAim = next.trim();

  if (state.route.name === "focus") render();
}
function exitFocusMode() {
  // Stop the timer if running and return to dashboard
  if (focusState) {
    if (!confirm("End this focus session and exit?")) return;
    stopFocus();
  }
  go("dashboard");
}
function startFocus() {
  const dur = state.settings.pomodoroMin * 60 * 1000;
  focusState = { mode:"work", endTs: Date.now()+dur, paused:false, remainingAtPause:0, cyclesDone:0 };
  beginFocusTick();
  notify("Focus session started", `${state.settings.pomodoroMin} min of deep work`);
  render();
}
function pauseFocus() {
  if (!focusState || focusState.paused) return;
  focusState.paused = true;
  focusState.remainingAtPause = Math.max(0, Math.round((focusState.endTs - Date.now())/1000));
  if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
  render();
}
function resumeFocus() {
  if (!focusState || !focusState.paused) return;
  focusState.endTs = Date.now() + focusState.remainingAtPause*1000;
  focusState.paused = false;
  beginFocusTick();
  render();
}
function skipFocus() {
  if (!focusState) return;
  focusState.endTs = Date.now();
  // immediately tick
  beginFocusTick();
}
function stopFocus() {
  focusState = null;
  if (focusTimer) { clearInterval(focusTimer); focusTimer = null; }
  try { document.title = "ExamForge — Premium Build"; } catch {}
  render();
}

/* Light-touch tick — updates ONLY the timer text + cycle dots, never re-renders DOM */
function updateFocusTick() {
  if (!focusState || state.route.name !== "focus") return;
  const fs = focusState;
  const remaining = fs.paused ? fs.remainingAtPause : Math.max(0, Math.round((fs.endTs - Date.now())/1000));
  const isWork = fs.mode === "work";
  const isBreak = !isWork;
  const lowTime = remaining <= 10 && remaining > 0;

  const timeEl = document.getElementById("focus-mega-time");
  if (timeEl) {
    timeEl.textContent = fmtHHMMSS(remaining);
    const cls = "focus-mega-time" + (isBreak?" break-mode":"") + (lowTime?" warn":"") + (fs.paused?" paused":"");
    if (timeEl.className !== cls) timeEl.className = cls;
  }
  try { document.title = fmtHHMMSS(remaining) + " · " + (isWork ? "Focus" : "Break") + " · ExamForge"; } catch {}
}

function beginFocusTick() {
  if (focusTimer) clearInterval(focusTimer);
  focusTimer = setInterval(()=>{
    if (!focusState) return;
    if (focusState.paused) { updateFocusTick(); return; }
    const left = focusState.endTs - Date.now();
    if (left <= 0) {
      const wasWork = focusState.mode === "work";
      if (wasWork) {
        focusState.cyclesDone++;
        focusState.mode = focusState.cyclesDone >= 4 ? "longBreak" : "break";
        const breakDur = (focusState.mode==="longBreak"?15:state.settings.breakMin) * 60 * 1000;
        focusState.endTs = Date.now() + breakDur;
        notify("Work session done!", "Time for a break.");
        toast("✓ Session done — take a break");
        if (focusState.cyclesDone >= 4) {
          setTimeout(()=>{ stopFocus(); toast("🏆 4 cycles complete! Great work."); }, breakDur);
        }
      } else {
        focusState.mode = "work";
        focusState.endTs = Date.now() + state.settings.pomodoroMin * 60 * 1000;
        notify("Break over", "Back to focus.");
        toast("Back to work");
      }
      if (state.route.name === "focus") render();
      return;
    }
    updateFocusTick();
  }, 1000);
}

    { section:"Actions", label:"Add question to bank",           icon:I.plus, run:()=>{ go("bank"); setTimeout(openBankAddModal, 50); } },
    { section:"Actions", label:"Start focus session (Pomodoro)", icon:I.focus, run:()=>{ go("focus"); setTimeout(startFocus, 50); } },
    { section:"Actions", label:"Toggle theme",                   icon:I.settings, run:()=>{ state.settings.theme = state.settings.theme==="dark"?"light":"dark"; persistSettings(); applyTheme(); render(); } },
    { section:"Actions", label:"Load starter pack",              icon:I.bolt, run:seedSampleData },
    { section:"Actions", label:"Export all data",                icon:I.arrow, run:exportAllData },
    { section:"Actions", label:"Sign out",                       icon:I.logout, run:doLogout },
  ];
  // Tests
  const testItems = state.tests.map(t => ({
    section: "Tests · Start exam", label: t.title, icon: I.exam,
    meta: `${t.subject} · ${t.questions.length} Qs`,
    run: ()=>go("exam",{testId:t.id})
  }));
  // Attempts (recent)
  const attemptItems = [...state.attempts].sort((a,b)=>b.submittedAt-a.submittedAt).slice(0,15).map(a => ({
    section: "Recent results", label: a.testTitle, icon: I.history,
    meta: relTime(a.submittedAt),
    run: ()=>go("results",{id:a.id})
  }));

  const all = [...nav, ...actions, ...testItems, ...attemptItems];
  if (!query) return all;
  return all.filter(x => (x.label + " " + (x.meta||"") + " " + x.section).toLowerCase().includes(query));
}
function executePaletteItem() {
  const item = paletteState.items[paletteState.activeIdx];
  if (!item) return;
  closePalette();
  item.run();
}
function handlePaletteKey(e) {
  if (!paletteState.open) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") { e.preventDefault(); if (currentUser()) go("bank"); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "d") { e.preventDefault(); if (currentUser()) go("dashboard"); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") { e.preventDefault(); if (currentUser()) go("focus"); }
    else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") { e.preventDefault(); if (currentUser()) go("insights"); }
    else if ((e.metaKey || e.ctrlKey) && e.key === "/") { e.preventDefault(); if (currentUser()) openCoach(); }
    return;
  }
  if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); paletteState.activeIdx = Math.min(paletteState.items.length-1, paletteState.activeIdx+1); paintPalette(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); paletteState.activeIdx = Math.max(0, paletteState.activeIdx-1); paintPalette(); }
  else if (e.key === "Enter") { e.preventDefault(); executePaletteItem(); }
}
window.addEventListener("keydown", handlePaletteKey);

/* ---------- MODAL HELPERS ---------- */
function showModal(html) {
  document.getElementById("overlay-host").innerHTML = `<div class="modal-back" id="generic-back">${html}</div>`;
  document.getElementById("generic-back").addEventListener("click", e=>{
    if (e.target.id === "generic-back") closeModal();
  });
}
function closeModal() { document.getElementById("overlay-host").innerHTML = ""; }

/* ---------- NOTIFICATIONS ---------- */
function notify(title, body) {
  if (state.settings.notify && typeof Notification !== "undefined" && Notification.permission === "granted") {
    try { new Notification(title, { body, icon: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#E11D2E"><circle cx="12" cy="12" r="10"/></svg>') }); } catch {}
  }
}

/* ---------- ONBOARDING TOUR ---------- */
const TOUR_STEPS = [
  {
    title: "Welcome to ExamForge.",
    body: "A serious tool for serious aspirants. Let's take 30 seconds to show you the four powers you now have.",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 L20 7 L20 17 L12 22 L4 17 L4 7 Z"/><path d="M12 7 V17 M8 12 H16"/></svg>`,
  },
  {
    title: "1. Real exam simulation.",
    body: "Build custom tests or use the starter pack. The Exam Engine runs full-screen with a real timer, palette, mark-for-review, and keyboard shortcuts — just like the actual exam.",
    icon: I.exam,
  },
  {
    title: "2. Deep mistake analysis.",
    body: "After every test, tag why you got each wrong question wrong: silly, conceptual, time pressure, calculation. Patterns surface in Analytics. You stop making the same mistakes.",
    icon: I.analytics,
  },
  {
    title: "3. Question Bank + Generator.",
    body: "Build a reusable bank of questions tagged by subject, topic, and difficulty. Generate random mock tests in two clicks. Forge new exams without retyping anything.",
    icon: I.bank,
  },
  {
    title: "4. AI Coach + Focus.",
    body: "Hit the red chat bubble (or ⌘/) anytime to ask the coach what to study. Pomodoro Focus Mode builds concentration. ⌘K opens command palette. You're ready — go forge.",
    icon: I.coach,
  },
];
let tourIdx = 0;
function startOnboarding() {
  tourIdx = 0;
  paintTour();
}
function paintTour() {
  const s = TOUR_STEPS[tourIdx];
  document.getElementById("overlay-host").innerHTML = `
    <div class="tour-back">
      <div class="tour-card">
        <div class="tour-step">Step ${tourIdx+1} of ${TOUR_STEPS.length}</div>
        <h2>${s.title}</h2>
        <div class="tour-illustration"><span style="width:64px;height:64px">${s.icon}</span></div>
        <p>${s.body}</p>
        <div class="tour-progress">${TOUR_STEPS.map((_,i)=>`<span class="tour-dot${i===tourIdx?' active':''}"></span>`).join("")}</div>
        <div class="tour-actions">
          <button class="btn btn-ghost" id="tour-skip">Skip</button>
          <div style="display:flex;gap:8px">
            ${tourIdx>0?`<button class="btn btn-secondary" id="tour-prev">Back</button>`:''}
            <button class="btn btn-primary" id="tour-next">${tourIdx===TOUR_STEPS.length-1?"Let's go →":"Next →"}</button>
          </div>
        </div>
      </div>
    </div>`;
  document.getElementById("tour-skip").addEventListener("click", finishTour);
  document.getElementById("tour-prev")?.addEventListener("click", ()=>{ tourIdx--; paintTour(); });
  document.getElementById("tour-next").addEventListener("click", ()=>{
    if (tourIdx === TOUR_STEPS.length-1) {
      finishTour();
      if (state.tests.length === 0) seedSampleData();
    } else {
      tourIdx++; paintTour();
    }
  });
}
function finishTour() {
  state.settings.onboarded = true; persistSettings();
  document.getElementById("overlay-host").innerHTML = "";
}


/* Global ESC handler for Focus Mode */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.route.name === "focus") {
    e.preventDefault();
    exitFocusMode();
  }
});

/* ---------- BOOT ---------- */
state.route = parseHash();
if (currentUser()) loadUserData();
applyTheme();
render();
</script>
